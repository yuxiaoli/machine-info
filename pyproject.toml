[project]
name = "machine-info"
version = "0.1.0"
description = "A CLI tool to collect machine introspection reports."
requires-python = ">=3.8"
dependencies = [
    "psutil>=5.9.0",
    "distro>=1.8.0",
    "jsonschema>=4.17.0",
    "rich>=13.0.0",
]

[project.scripts]
machine-info = "machine_info.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
